<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Budget Tracker System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>Budget Tracker System</h1>
    <div class="tracker">


        <div class="left-section">


            <div class="card">
                <h2>Add Budget</h2>

                <label>Budget:</label>
                <input type="number" id="budget">

                <button id="addBudgetBtn">
                    Add Budget
                </button>
            </div>
            <br>
            <br>
            <br>
            <div class="card">

                <h2>Add Expense</h2>
                <label>Expense title</label>
                <input type="name" id="budget">
                <label>amount</label>
                <input type="number" id="budget">
                <button id="addBudgetBtn">
                    Add Expense
                </button>
            </div>
            <br>
            <div class="card">
                <button id="addBudgetReset">
                    Reset All
                </button>
            </div>
            <br><br>
            <div class="right-section">


                <div class="summary">

                    <div class="summary-box">
                        Total Budget:
                        <span id="totalBudget">10000.00</span>
                    </div>
                    <div class="summary-box">
                        Total Expenses:
                        <span id="totalexpenses">7500.00</span>

                    </div>

                    <div class="summary-box">
                        budget Left:
                        <span id="budgetleft">2500.00</span>

                    </div>

                </div>

                <h3>Expense History:</h3>

                <table>
                    <thead>
                        <tr>
                            <th>Expense Name</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="expenseList">
                    </tbody>
                </table>

            </div>

        </div>

    </div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
